<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#064E3B">
    <title>ZCMC Regional Health Exchange | Referral Triage</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zcmc: {
                            forest: '#064E3B',
                            emerald: '#087A55',
                            mint: '#70B89B',
                            ivory: '#F7F5EC',
                            gold: '#C8A64D',
                            antiquegold: '#9C7A2F',
                            surface: '#FFFFFF',
                            border: '#E2E8F0',
                            textMain: '#0F172A',
                            textMuted: '#64748B'
                        }
                    },
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        body: ['Source Sans 3', 'sans-serif'],
                        formal: ['Libre Baskerville', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- Component CSS & JS Engine -->
    <link rel="stylesheet" href="/components.css">
    <script src="/components.js"></script>
    <style>
        @media (min-width: 1024px) {
            #formSection, #queueSection { display: flex !important; }
        }
    </style>
</head>
<body class="min-h-screen antialiased bg-zcmc-ivory text-zcmc-textMain">

    <div class="flex min-h-screen">
        <!-- Reusable Component: Desktop Institutional Sidebar -->
        <div id="zcmcSidebarMount" class="hidden md:flex"></div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 pb-safe">
            <!-- Reusable Component: Mobile App Header -->
            <div id="zcmcMobileHeaderMount"></div>

            <!-- Mobile Segmented Controller -->
            <div class="lg:hidden max-w-md mx-auto w-full px-4 pt-3 pb-1">
                <div class="bg-slate-200/80 p-1 rounded-xl flex items-center text-xs font-bold text-slate-700 border border-slate-300/50">
                    <button id="segBtnForm" onclick="switchMobileView('form')" class="flex-1 py-2 rounded-lg bg-zcmc-forest text-white shadow-xs transition touch-action flex items-center justify-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-zcmc-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                        </svg>
                        <span>New Referral</span>
                    </button>
                    <button id="segBtnQueue" onclick="switchMobileView('queue')" class="flex-1 py-2 rounded-lg text-slate-700 hover:text-black transition touch-action flex items-center justify-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <span>Active Queue</span>
                        <span id="mobileQueueBadge" class="px-1.5 py-0.2 rounded-full bg-slate-300 text-slate-800 text-[10px]">0</span>
                    </button>
                </div>
            </div>

            <!-- Compact KPI Metrics Strip -->
            <section class="max-w-7xl mx-auto px-4 pt-3 pb-1 w-full overflow-x-auto">
                <div class="flex lg:grid lg:grid-cols-4 gap-2.5 sm:gap-3 min-w-[550px] lg:min-w-0">
                    
                    <div class="flex-1 bg-zcmc-surface rounded-xl p-3 border border-zcmc-border shadow-xs flex items-center justify-between">
                        <div>
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-zcmc-textMuted font-heading">Total Referrals</span>
                            <span id="kpiTotal" class="text-lg sm:text-xl font-extrabold text-zcmc-forest font-heading">0</span>
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-emerald-50 text-zcmc-emerald flex items-center justify-center border border-emerald-100">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                        </div>
                    </div>

                    <div class="flex-1 bg-zcmc-surface rounded-xl p-3 border border-rose-200 shadow-xs flex items-center justify-between">
                        <div>
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-rose-700 font-heading">STAT Critical</span>
                            <span id="kpiStat" class="text-lg sm:text-xl font-extrabold text-rose-800 font-heading">0</span>
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center border border-rose-100">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                        </div>
                    </div>

                    <div class="flex-1 bg-zcmc-surface rounded-xl p-3 border border-blue-200 shadow-xs flex items-center justify-between">
                        <div>
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-blue-700 font-heading">In Sea Transit</span>
                            <span id="kpiTransit" class="text-lg sm:text-xl font-extrabold text-blue-700 font-heading">0</span>
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center border border-blue-100">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"/>
                            </svg>
                        </div>
                    </div>

                    <div class="flex-1 bg-zcmc-surface rounded-xl p-3 border border-amber-200 shadow-xs flex items-center justify-between">
                        <div>
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-amber-700 font-heading">Device Vault</span>
                            <span id="kpiQueue" class="text-lg sm:text-xl font-extrabold text-amber-800 font-heading zcmc-vault-count">0</span>
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center border border-amber-100">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                    </div>

                </div>
            </section>

            <!-- Main Workspace: Intake Form & Active Queue -->
            <main class="max-w-7xl mx-auto px-4 py-3 grid grid-cols-1 lg:grid-cols-12 gap-5 flex-grow w-full">
                
                <!-- View 1: Referral Intake Form -->
                <section id="formSection" class="lg:col-span-5 bg-zcmc-surface border border-zcmc-border rounded-xl shadow-xs overflow-hidden flex flex-col">
                    <div class="bg-slate-50 border-b border-zcmc-border px-4 py-3 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <div class="w-2.5 h-2.5 rounded-full bg-zcmc-emerald"></div>
                            <h2 class="text-xs sm:text-sm font-bold uppercase tracking-wider text-zcmc-forest font-heading">
                                New GIDA Referral Intake
                            </h2>
                        </div>
                        <span class="inline-flex items-center gap-1 text-[10px] font-bold text-zcmc-emerald bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                            AES-256 Sealed
                        </span>
                    </div>

                    <form id="referralForm" onsubmit="handleReferralSubmit(event)" class="p-4 sm:p-5 space-y-3.5 flex-grow flex flex-col justify-between">
                        <div class="space-y-3.5">
                            <div>
                                <label for="patientName" class="block text-xs font-bold uppercase tracking-wider text-zcmc-textMain mb-1">
                                    Patient Full Name <span class="text-rose-600">*</span>
                                </label>
                                <input type="text" id="patientName" required placeholder="e.g., Fatima S. Alih" 
                                       class="w-full min-h-[44px] bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-zcmc-textMain placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-zcmc-emerald focus:border-zcmc-emerald transition">
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label for="philhealthId" class="block text-xs font-bold uppercase tracking-wider text-zcmc-textMain mb-1">
                                        PhilHealth ID
                                    </label>
                                    <input type="text" id="philhealthId" placeholder="12-345678901-2" inputmode="numeric"
                                           class="w-full min-h-[44px] bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-zcmc-textMain placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-zcmc-emerald focus:border-zcmc-emerald transition">
                                </div>
                                <div>
                                    <label for="urgency" class="block text-xs font-bold uppercase tracking-wider text-zcmc-textMain mb-1">
                                        Triage Urgency <span class="text-rose-600">*</span>
                                    </label>
                                    <select id="urgency" class="w-full min-h-[44px] bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-zcmc-textMain font-semibold focus:outline-none focus:ring-2 focus:ring-zcmc-emerald focus:border-zcmc-emerald transition">
                                        <option value="stat" selected class="text-rose-700 font-bold">STAT (Life Threat)</option>
                                        <option value="asap" class="text-amber-700 font-bold">ASAP (Immediate 2-4h)</option>
                                        <option value="urgent" class="text-blue-700 font-semibold">Urgent (Within 24h)</option>
                                        <option value="routine" class="text-slate-700">Routine Non-Emergency</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label for="originFacility" class="block text-xs font-bold uppercase tracking-wider text-zcmc-textMain mb-1">
                                        Origin Facility (GIDA) <span class="text-rose-600">*</span>
                                    </label>
                                    <select id="originFacility" class="w-full min-h-[44px] bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-zcmc-textMain focus:outline-none focus:ring-2 focus:ring-zcmc-emerald focus:border-zcmc-emerald transition">
                                        <option value="Basilan General Hospital">Basilan General Hospital</option>
                                        <option value="Lamitan District Hospital">Lamitan District Hospital</option>
                                        <option value="Sulu Provincial Hospital">Sulu Provincial Hospital (Jolo)</option>
                                        <option value="Tawi-Tawi Integrated Provincial Health Office">Tawi-Tawi IPHO (Bongao)</option>
                                        <option value="Luuk District Hospital">Luuk District Hospital (Sulu)</option>
                                        <option value="Mapun Municipal Hospital">Mapun Island Hospital</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="transitStatus" class="block text-xs font-bold uppercase tracking-wider text-zcmc-textMain mb-1">
                                        Transit Stage <span class="text-rose-600">*</span>
                                    </label>
                                    <select id="transitStatus" class="w-full min-h-[44px] bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-zcmc-textMain font-medium focus:outline-none focus:ring-2 focus:ring-zcmc-emerald focus:border-zcmc-emerald transition">
                                        <option value="pending_transit" selected>1. Pending Boat Departure</option>
                                        <option value="in_maritime_transit">2. In Maritime Sea Transit</option>
                                        <option value="arrived_port">3. Arrived at Zamboanga Port</option>
                                        <option value="admitted_zcmc">4. Admitted at ZCMC ER</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label for="primaryDiagnosis" class="block text-xs font-bold uppercase tracking-wider text-zcmc-textMain mb-1">
                                    Primary Clinical Diagnosis <span class="text-rose-600">*</span>
                                </label>
                                <input type="text" id="primaryDiagnosis" required placeholder="e.g., Acute Perforated Appendicitis with Peritonitis" 
                                       class="w-full min-h-[44px] bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-zcmc-textMain placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-zcmc-emerald focus:border-zcmc-emerald transition">
                            </div>

                            <div>
                                <label for="clinicalNotes" class="block text-xs font-bold uppercase tracking-wider text-zcmc-textMain mb-1">
                                    Clinical Vitals &amp; Sea Instructions
                                </label>
                                <textarea id="clinicalNotes" rows="2" placeholder="BP: 130/85, HR: 98, SpO2: 97%. IV line patent. Sea ambulance escort active." 
                                          class="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-zcmc-textMain placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-zcmc-emerald focus:border-zcmc-emerald transition"></textarea>
                            </div>
                        </div>

                        <div class="pt-2">
                            <button type="submit" id="submitBtn" 
                                    class="w-full min-h-[48px] py-3 px-4 rounded-xl bg-zcmc-forest hover:bg-zcmc-emerald active:bg-zcmc-forest text-white font-bold text-sm tracking-wide transition shadow-sm border border-zcmc-gold/40 flex items-center justify-center gap-2 touch-action">
                                <svg class="w-4 h-4 text-zcmc-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                                </svg>
                                <span>ISSUE HL7 FHIR REFERRAL</span>
                            </button>
                            <p class="text-[10px] text-center text-zcmc-textMuted mt-1.5">
                                Client-side AES-256 encryption active &bull; Store-and-forward outbox
                            </p>
                        </div>
                    </form>
                </section>

                <!-- View 2: Active Maritime Triage Queue -->
                <section id="queueSection" class="hidden lg:flex lg:col-span-7 flex-col space-y-3">
                    <div class="bg-zcmc-surface border border-zcmc-border rounded-xl p-3 shadow-xs space-y-2.5">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                </svg>
                            </span>
                            <input type="text" id="searchInput" oninput="filterReferrals()" placeholder="Search patient, ID, or island..." 
                                   class="w-full pl-9 pr-3 py-2 text-xs min-h-[40px] bg-slate-50 border border-slate-200 rounded-lg text-zcmc-textMain placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-1 focus:ring-zcmc-emerald focus:border-zcmc-emerald transition">
                        </div>

                        <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 text-xs">
                            <button onclick="setFilter('all')" id="filter-all" class="filter-pill px-3 py-1.5 rounded-lg font-bold bg-zcmc-forest text-white whitespace-nowrap touch-action">All</button>
                            <button onclick="setFilter('stat')" id="filter-stat" class="filter-pill px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:bg-slate-100 whitespace-nowrap touch-action">STAT</button>
                            <button onclick="setFilter('in_maritime_transit')" id="filter-in_maritime_transit" class="filter-pill px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:bg-slate-100 whitespace-nowrap touch-action">At Sea</button>
                            <button onclick="setFilter('arrived_port')" id="filter-arrived_port" class="filter-pill px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:bg-slate-100 whitespace-nowrap touch-action">At Port</button>
                        </div>
                    </div>

                    <div id="referralsContainer" class="space-y-3 flex-grow overflow-y-auto pr-0.5 max-h-[calc(100vh-280px)]"></div>
                </section>
            </main>

            <!-- Reusable Component: Desktop Institutional Footer -->
            <div id="zcmcFooterMount"></div>
            <!-- Reusable Component: Mobile Bottom Navigation -->
            <div id="zcmcBottomNavMount"></div>
        </div>
    </div>

    <!-- FHIR ServiceRequest Modal -->
    <div id="fhirModal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl max-w-2xl w-full border border-slate-300 overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-zcmc-forest text-white px-4 py-3 flex items-center justify-between border-b-2 border-zcmc-gold">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-zcmc-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                    </svg>
                    <h3 class="font-bold text-xs sm:text-sm font-heading" id="fhirModalTitle">HL7 FHIR R4 ServiceRequest</h3>
                </div>
                <button onclick="closeFhirModal()" class="text-slate-300 hover:text-white p-1 rounded-md text-lg leading-none">&times;</button>
            </div>
            <div class="p-3 overflow-y-auto flex-grow bg-slate-50">
                <pre id="fhirModalContent" class="text-[11px] font-mono text-slate-800 bg-white p-3 rounded-lg border border-slate-200 overflow-x-auto select-all"></pre>
            </div>
            <div class="px-4 py-2.5 bg-white border-t border-slate-200 flex items-center justify-between">
                <span class="text-[10px] text-slate-500">DOH &amp; HL7 Conformance</span>
                <button onclick="copyFhirJson()" id="copyJsonBtn" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-zcmc-emerald text-white touch-action">
                    Copy JSON
                </button>
            </div>
        </div>
    </div>

    <script>
        let allReferrals = [];
        let activeFilter = 'all';
        let currentMobileView = 'form';

        // Initialize component layout
        ZCMC.init('referrals');
        ZCMC.onSync(() => fetchReferrals());

        function switchMobileView(view) {
            currentMobileView = view;
            const formSec = document.getElementById("formSection");
            const queueSec = document.getElementById("queueSection");
            const segBtnForm = document.getElementById("segBtnForm");
            const segBtnQueue = document.getElementById("segBtnQueue");

            if (view === 'form') {
                formSec.classList.remove("hidden");
                queueSec.classList.add("hidden");
                queueSec.classList.remove("flex");

                segBtnForm.className = "flex-1 py-2 rounded-lg bg-zcmc-forest text-white shadow-xs transition touch-action flex items-center justify-center gap-1.5";
                segBtnQueue.className = "flex-1 py-2 rounded-lg text-slate-700 hover:text-black transition touch-action flex items-center justify-center gap-1.5";
            } else {
                formSec.classList.add("hidden");
                queueSec.classList.remove("hidden");
                queueSec.classList.add("flex");

                segBtnQueue.className = "flex-1 py-2 rounded-lg bg-zcmc-forest text-white shadow-xs transition touch-action flex items-center justify-center gap-1.5";
                segBtnForm.className = "flex-1 py-2 rounded-lg text-slate-700 hover:text-black transition touch-action flex items-center justify-center gap-1.5";
            }
        }

        async function handleReferralSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;

            const referralId = "ZCMC-" + Math.floor(100000 + Math.random() * 900000);
            const referralData = {
                id: referralId,
                patient_name: document.getElementById("patientName").value.trim(),
                philhealth_id: document.getElementById("philhealthId").value.trim() || null,
                origin_facility: document.getElementById("originFacility").value,
                destination_facility: "Zamboanga City Medical Center (ZCMC)",
                urgency: document.getElementById("urgency").value,
                primary_diagnosis: document.getElementById("primaryDiagnosis").value.trim(),
                transit_status: document.getElementById("transitStatus").value,
                clinical_notes: document.getElementById("clinicalNotes").value.trim(),
                client_id: "edge-terminal"
            };

            if (ZCMC.isEffectiveOnline()) {
                try {
                    const res = await fetch("/api/referrals", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(referralData)
                    });
                    if (res.ok) {
                        ZCMC.showToast(`Referral ${referralId} synced to ZCMC Hub.`, "success");
                        document.getElementById("referralForm").reset();
                        fetchReferrals();
                        submitBtn.disabled = false;
                        if (window.innerWidth < 1024) switchMobileView('queue');
                        return;
                    }
                } catch (err) {
                    console.warn("Hub unreachable, engaging store-and-forward:", err);
                }
            }

            try {
                const encrypted = await ZCMC.encryptPayload(referralData);
                const vault = ZCMC.getVault();
                vault.unshift(encrypted);
                ZCMC.saveVault(vault);
                
                ZCMC.showToast(`Offline: Referral ${referralId} sealed in AES-256 vault.`, "success");
                document.getElementById("referralForm").reset();
                renderLocalPipeline();
                if (window.innerWidth < 1024) switchMobileView('queue');
            } catch (cryptoErr) {
                console.error("Encryption failure:", cryptoErr);
                ZCMC.showToast("Cryptographic error on edge device.", "error");
            } finally {
                submitBtn.disabled = false;
            }
        }

        async function fetchReferrals() {
            try {
                const res = await fetch("/api/referrals");
                if (res.ok) {
                    const hubReferrals = await res.json();
                    const vault = ZCMC.getVault();
                    allReferrals = vault.concat(hubReferrals);
                    renderReferrals(allReferrals);
                    updateKpis(allReferrals);
                }
            } catch (err) {
                renderLocalPipeline();
            }
        }

        function renderLocalPipeline() {
            const vault = ZCMC.getVault();
            allReferrals = vault.concat(allReferrals.filter(r => !r.is_encrypted));
            renderReferrals(allReferrals);
            updateKpis(allReferrals);
        }

        function updateKpis(data) {
            const total = data.length;
            const stat = data.filter(r => r.urgency === 'stat').length;
            const transit = data.filter(r => r.transit_status === 'in_maritime_transit').length;
            const vaultCount = ZCMC.getVault().length;

            document.getElementById("kpiTotal").innerText = total;
            document.getElementById("kpiStat").innerText = stat;
            document.getElementById("kpiTransit").innerText = transit;
            document.getElementById("kpiQueue").innerText = vaultCount;

            const mobileBadge = document.getElementById("mobileQueueBadge");
            if (mobileBadge) mobileBadge.innerText = total;
        }

        function setFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.className = "filter-pill px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:bg-slate-100 whitespace-nowrap touch-action";
            });
            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) {
                activeBtn.className = "filter-pill px-3 py-1.5 rounded-lg font-bold bg-zcmc-forest text-white whitespace-nowrap touch-action";
            }
            filterReferrals();
        }

        function filterReferrals() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            let filtered = allReferrals;

            if (activeFilter === 'stat') filtered = filtered.filter(r => r.urgency === 'stat');
            else if (activeFilter === 'in_maritime_transit') filtered = filtered.filter(r => r.transit_status === 'in_maritime_transit');
            else if (activeFilter === 'arrived_port') filtered = filtered.filter(r => r.transit_status === 'arrived_port');

            if (search) {
                filtered = filtered.filter(r => 
                    (r.patient_name && r.patient_name.toLowerCase().includes(search)) ||
                    (r.id && r.id.toLowerCase().includes(search)) ||
                    (r.origin_facility && r.origin_facility.toLowerCase().includes(search)) ||
                    (r.primary_diagnosis && r.primary_diagnosis.toLowerCase().includes(search))
                );
            }
            renderReferrals(filtered);
        }

        function renderReferrals(referrals) {
            const container = document.getElementById("referralsContainer");
            container.innerHTML = "";

            if (!referrals || referrals.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center bg-white border border-dashed border-slate-300 rounded-xl">
                        <svg class="w-8 h-8 mx-auto text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <p class="text-xs font-bold text-slate-700">No referrals found</p>
                    </div>
                `;
                return;
            }

            referrals.forEach(r => {
                const card = document.createElement("div");
                card.className = "bg-zcmc-surface border border-zcmc-border rounded-xl p-3.5 shadow-xs space-y-2.5 transition hover:border-zcmc-emerald";

                let urgencyBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-700 uppercase">Routine</span>';
                if (r.urgency === 'stat') urgencyBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-800 uppercase border border-rose-300">STAT Critical</span>';
                else if (r.urgency === 'asap') urgencyBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 uppercase border border-amber-300">ASAP 2-4h</span>';
                else if (r.urgency === 'urgent') urgencyBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800 uppercase border border-blue-300">Urgent 24h</span>';

                let transitPill = '<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-700">1. Departure Pending</span>';
                if (r.transit_status === 'in_maritime_transit') transitPill = '<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-blue-50 text-blue-700 border border-blue-200">2. In Sea Transit</span>';
                else if (r.transit_status === 'arrived_port') transitPill = '<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-amber-50 text-amber-800 border border-amber-200">3. Arrived at Port</span>';
                else if (r.transit_status === 'admitted_zcmc') transitPill = '<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-50 text-emerald-800 border border-emerald-200">4. Admitted ZCMC</span>';

                const encryptedPill = r.is_encrypted 
                    ? '<span class="px-1.5 py-0.2 rounded text-[9px] font-bold bg-amber-100 text-amber-800 border border-amber-300">AES-256 VAULT</span>' 
                    : '<span class="px-1.5 py-0.2 rounded text-[9px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">FHIR R4 HUB</span>';

                const patientDisplay = r.is_encrypted ? r.masked_patient : (r.patient_name || "Unknown Patient");

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <div class="flex items-center gap-2">
                            <span class="font-mono font-bold text-xs text-zcmc-forest">${r.id}</span>
                            ${encryptedPill}
                        </div>
                        <div class="flex items-center gap-1.5">
                            ${urgencyBadge}
                            ${transitPill}
                        </div>
                    </div>

                    <div class="space-y-1 text-xs">
                        <div class="flex items-center justify-between">
                            <h4 class="font-bold text-sm text-zcmc-textMain">${patientDisplay}</h4>
                            <span class="text-[10px] text-slate-500">${r.philhealth_id ? 'PhilHealth: ' + r.philhealth_id : ''}</span>
                        </div>
                        <p class="text-xs text-slate-600 line-clamp-1"><strong class="text-slate-800">Diagnosis:</strong> ${r.primary_diagnosis}</p>
                        <p class="text-[11px] text-slate-500 line-clamp-1"><strong class="text-slate-700">Origin:</strong> ${r.origin_facility}</p>
                    </div>

                    <div class="flex items-center justify-between pt-1 border-t border-slate-100 text-xs">
                        <button onclick="viewFhir('${r.id}')" class="text-[11px] font-bold text-zcmc-emerald hover:underline flex items-center gap-1">
                            <span>FHIR Resource</span>
                            &rarr;
                        </button>

                        <select onchange="updateReferralTransit('${r.id}', this.value)" class="text-xs bg-slate-50 border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700 focus:outline-none">
                            <option value="pending_transit" ${r.transit_status === 'pending_transit' ? 'selected' : ''}>1. Departure</option>
                            <option value="in_maritime_transit" ${r.transit_status === 'in_maritime_transit' ? 'selected' : ''}>2. Sea</option>
                            <option value="arrived_port" ${r.transit_status === 'arrived_port' ? 'selected' : ''}>3. Port</option>
                            <option value="admitted_zcmc" ${r.transit_status === 'admitted_zcmc' ? 'selected' : ''}>4. ZCMC</option>
                        </select>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function updateReferralTransit(referralId, newStatus) {
            const target = allReferrals.find(r => r.id === referralId);
            if (!target) return;

            const updatedData = {
                id: target.id,
                patient_name: target.patient_name || target.masked_patient,
                philhealth_id: target.philhealth_id,
                origin_facility: target.origin_facility,
                destination_facility: target.destination_facility,
                urgency: target.urgency,
                primary_diagnosis: target.primary_diagnosis,
                transit_status: newStatus,
                clinical_notes: target.clinical_notes || "",
                client_id: "edge-terminal"
            };

            if (ZCMC.isEffectiveOnline()) {
                try {
                    const res = await fetch("/api/referrals", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updatedData)
                    });
                    if (res.ok) {
                        ZCMC.showToast(`Transit status updated to ${newStatus.replace(/_/g, ' ')}.`, "success");
                        fetchReferrals();
                        return;
                    }
                } catch (err) {
                    console.warn("Hub unreachable:", err);
                }
            }

            target.transit_status = newStatus;
            const encrypted = await ZCMC.encryptPayload(updatedData);
            const vault = ZCMC.getVault();
            vault.unshift(encrypted);
            ZCMC.saveVault(vault);
            ZCMC.showToast(`Offline status update sealed in vault.`, "success");
            renderReferrals(allReferrals);
            updateKpis(allReferrals);
        }

        function viewFhir(referralId) {
            const target = allReferrals.find(r => r.id === referralId);
            if (!target) return;

            let resource = null;
            if (target.fhir_resource) {
                try {
                    resource = typeof target.fhir_resource === 'string' ? JSON.parse(target.fhir_resource) : target.fhir_resource;
                } catch (e) {
                    resource = target;
                }
            } else {
                resource = {
                    resourceType: "ServiceRequest",
                    id: target.id,
                    status: "active",
                    priority: target.urgency,
                    subject: { display: target.patient_name || target.masked_patient },
                    requester: { display: target.origin_facility },
                    performer: [{ display: target.destination_facility }],
                    code: { text: target.primary_diagnosis }
                };
            }

            document.getElementById("fhirModalTitle").innerText = `FHIR ServiceRequest • ${target.id}`;
            document.getElementById("fhirModalContent").innerText = JSON.stringify(resource, null, 2);
            document.getElementById("fhirModal").classList.remove("hidden");
            document.getElementById("fhirModal").classList.add("flex");
        }

        function closeFhirModal() {
            document.getElementById("fhirModal").classList.add("hidden");
            document.getElementById("fhirModal").classList.remove("flex");
        }

        function copyFhirJson() {
            const content = document.getElementById("fhirModalContent").innerText;
            navigator.clipboard.writeText(content).then(() => {
                const btn = document.getElementById("copyJsonBtn");
                btn.innerText = "Copied!";
                setTimeout(() => { btn.innerText = "Copy JSON"; }, 2000);
            });
        }

        fetchReferrals();
    </script>
</body>
</html>
